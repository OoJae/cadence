[package]
name = "cadence-core"
version = "0.0.1"
description = "Pre-authorized shielded payment mandates on Zcash Ironwood: rung ladders, sealing, self-tests"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
zcash_primitives = { workspace = true, features = ["std", "non-standard-fees"] }
zcash_protocol = { workspace = true }
zcash_keys = { workspace = true, features = ["orchard", "unstable-frost"] }
pczt = { workspace = true, features = ["orchard", "zcp-builder", "io-finalizer", "signer"] }
orchard = { workspace = true, features = ["std"] }
rand = { workspace = true }
zip32 = { workspace = true }
blake2b_simd = { workspace = true }
serde = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[features]
default = []
prover = ["zcash_primitives/circuits", "pczt/prover", "pczt/tx-extractor", "orchard/circuit"]
