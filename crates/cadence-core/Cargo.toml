[package]
name = "cadence-core"
version = "0.0.1"
description = "Pre-authorized shielded payment mandates on Zcash Ironwood: rung ladders, sealing, self-tests"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
zcash_primitives = { workspace = true, features = ["std", "circuits"] }
zcash_protocol = { workspace = true }
zcash_keys = { workspace = true, features = ["orchard", "unstable-frost"] }
pczt = { workspace = true, features = ["orchard", "zcp-builder", "io-finalizer", "signer", "prover", "tx-extractor"] }
orchard = { workspace = true, features = ["std", "circuit"] }
rand = { workspace = true }
zip32 = { workspace = true }
blake2b_simd = { workspace = true }
serde = { workspace = true }
