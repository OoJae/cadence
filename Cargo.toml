[workspace]
resolver = "2"
members = [
    "crates/cadence-core",
    "crates/cadence-chain",
    "crates/cadence-cli",
    "crates/cadence-decode",
    "crates/cadence-runner",
    "crates/cadence-seal",
    "crates/cadence-wasm",
]

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OoJae/cadence"

[workspace.dependencies]
zcash_primitives = { version = "=0.31.0", default-features = false }
zcash_proofs = { version = "=0.31.0", default-features = false }
zcash_protocol = { version = "=0.11.0" }
zcash_keys = { version = "=0.17.0" }
zcash_address = { version = "=0.14.0" }
zip321 = { version = "=0.10.0" }
pczt = { version = "=0.10.0", default-features = false }
orchard = { version = "=0.16.0", default-features = false }
rand = { version = "0.10", default-features = false, features = ["std", "chacha", "sys_rng", "thread_rng"] }
zip32 = { version = "0.3", default-features = false }
blake2b_simd = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
zcash_client_backend = { version = "=0.25.0" }
zcash_client_sqlite = { version = "=0.23.0" }
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14", features = ["tls-webpki-roots"] }
rusqlite = { version = "0.37", features = ["bundled"] }
shardtree = "0.8"
async-trait = "0.1"
incrementalmerkletree = "0.9"
age = { version = "0.11", default-features = false }
tlock_age = { version = "=0.0.10", default-features = false }
tlock = { version = "=0.0.10", default-features = false }
thiserror = "2"
zstd = { version = "0.14", default-features = false }
ruzstd = { version = "0.9", default-features = false }
ureq = { version = "3", default-features = false }
sha2 = "0.10"
ark-bls12-381 = "0.6"
ark-ec = "0.6"
ark-ff = "0.6"
ark-serialize = "0.6"
axum = "0.8"
base64 = "0.22"
hmac = "0.12"
uuid = "1"
tower-http = { version = "0.6", features = ["fs", "set-header"] }

# Proving and key stretching are unusably slow unoptimized, even in dev builds.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.halo2_proofs]
opt-level = 3
[profile.dev.package.pasta_curves]
opt-level = 3
