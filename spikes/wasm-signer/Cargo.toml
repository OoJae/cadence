[package]
name = "cadence-wasm-signer"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: not a member of the root Cadence workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cadence-core = { path = "../../crates/cadence-core" }
orchard = { version = "=0.16.0", default-features = false }
zcash_protocol = { version = "=0.11.0" }
pczt = { version = "=0.10.0", default-features = false }
wasm-bindgen = "0.2"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
